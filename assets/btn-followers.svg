<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" width="205">
  <defs>
    <!-- Deep Glass Pill Fill -->
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151A" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0B1924" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#09131C" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Static Subtle Rim -->
    <linearGradient id="baseRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Waving Shimmer Light Rim -->
    <linearGradient id="waveRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#99F6E4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="35%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07151A" stop-opacity="0"/>
    </radialGradient>

    <style>
      .font-sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes waveLight {
        0% { stroke-dashoffset: 480; }
        100% { stroke-dashoffset: 0; }
      }
      .floating { animation: floatPill 3.6s ease-in-out infinite; }
      .shimmer {
        stroke-dasharray: 110 370;
        animation: waveLight 4.5s linear infinite;
      }
    </style>
  </defs>

  <g class="floating">
    <!-- Pill Body (Fully Rounded Stadium rx=26) -->
    <rect x="6" y="6" width="198" height="52" rx="26" fill="url(#pillFill)"/>
    <rect x="6" y="6" width="198" height="52" rx="26" fill="url(#topGlow)"/>
    <rect x="6" y="6" width="198" height="52" rx="26" fill="none" stroke="url(#baseRim)" stroke-width="1.3"/>
    <!-- Animated Waving Light Border -->
    <rect x="6" y="6" width="198" height="52" rx="26" fill="none" stroke="url(#waveRim)" stroke-width="2" stroke-linecap="round" class="shimmer"/>

    <!-- Left Circular Icon Badge -->
    <circle cx="36" cy="32" r="16" fill="#162730" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1"/>
    <!-- GitHub Octocat / Community Icon -->
    <path transform="translate(28, 24)" fill="#E2E8F0" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>

    <!-- Two-Line Text Stack -->
    <text x="62" y="27" fill="#5EEAD4" font-size="10.5" font-weight="800" letter-spacing="0.8" class="font-sans">GitHub Network</text>
    <text x="62" y="44" fill="#F8FAFC" font-size="14" font-weight="800" class="font-sans">@Codinggeniusnks</text>
  </g>
</svg>
