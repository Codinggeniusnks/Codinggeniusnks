<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="100%">
  <defs>
    <!-- Cinematic Deep Glass Base -->
    <linearGradient id="cineBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="50%" stop-color="#0B1623"/>
      <stop offset="100%" stop-color="#111328"/>
    </linearGradient>

    <radialGradient id="spotMint" cx="20%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spotViolet" cx="85%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111328" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="innerCardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061017" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0B1320" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="innerCardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.18"/>
    </linearGradient>

    <style>
      .font-sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Rounded Cinematic Glass Frame -->
  <rect x="2" y="2" width="556" height="316" rx="22" fill="url(#cineBase)"/>
  <rect x="2" y="2" width="556" height="316" rx="22" fill="url(#spotMint)"/>
  <rect x="2" y="2" width="556" height="316" rx="22" fill="url(#spotViolet)"/>
  <rect x="2" y="2" width="556" height="316" rx="22" fill="none" stroke="url(#rimBorder)" stroke-width="1.4"/>

  <!-- Eyebrow Header -->
  <text x="30" y="38" fill="#5EEAD4" font-size="11.5" font-weight="800" letter-spacing="3" class="font-sans">ABOUT ME // SYSTEM PROFILE</text>

  <!-- Bio Intro -->
  <text x="30" y="66" fill="#F8FAFC" font-size="17" font-weight="800" class="font-sans">Curiosity fuels everything I build.</text>
  <text x="30" y="88" fill="#CBD5E1" font-size="12" class="font-sans">I'm <tspan fill="#5EEAD4" font-weight="700">KAI SHENG (Ng Kai Sheng)</tspan> — an <tspan fill="#818CF8" font-weight="600">AI • ML • Full Stack Developer</tspan></text>
  <text x="30" y="105" fill="#94A3B8" font-size="12" class="font-sans">turning ideas into intelligent models, clean code, and real-world impact.</text>

  <!-- 2x2 Grid of Inner Recessed Glass Cards with Left Vertical Glow Bars -->
  <!-- Card 1: Currently Building -->
  <g transform="translate(26, 122)">
    <rect x="0" y="0" width="246" height="82" rx="14" fill="url(#innerCardFill)" stroke="url(#innerCardRim)" stroke-width="1.1"/>
    <rect x="0" y="16" width="4.5" height="50" rx="2.2" fill="#5EEAD4"/>
    <text x="20" y="32" fill="#F8FAFC" font-size="14" font-weight="700" class="font-sans">Currently Building</text>
    <text x="20" y="52" fill="#5EEAD4" font-size="11.5" class="font-sans">AI-driven apps &amp; workflows</text>
    <text x="20" y="68" fill="#64748B" font-size="10.5" class="font-mono">Personal &amp; open-source tech</text>
  </g>

  <!-- Card 2: Exploring & Learning -->
  <g transform="translate(288, 122)">
    <rect x="0" y="0" width="246" height="82" rx="14" fill="url(#innerCardFill)" stroke="url(#innerCardRim)" stroke-width="1.1"/>
    <rect x="0" y="16" width="4.5" height="50" rx="2.2" fill="#38BDF8"/>
    <text x="20" y="32" fill="#F8FAFC" font-size="14" font-weight="700" class="font-sans">Exploring &amp; Learning</text>
    <text x="20" y="52" fill="#38BDF8" font-size="11.5" class="font-sans">Deep Learning &amp; LLM Agents</text>
    <text x="20" y="68" fill="#64748B" font-size="10.5" class="font-mono">Scalable cloud architectures</text>
  </g>

  <!-- Card 3: Open to Collaborate -->
  <g transform="translate(26, 216)">
    <rect x="0" y="0" width="246" height="82" rx="14" fill="url(#innerCardFill)" stroke="url(#innerCardRim)" stroke-width="1.1"/>
    <rect x="0" y="16" width="4.5" height="50" rx="2.2" fill="#818CF8"/>
    <text x="20" y="32" fill="#F8FAFC" font-size="14" font-weight="700" class="font-sans">Collaboration Queue</text>
    <text x="20" y="52" fill="#A78BFA" font-size="11.5" class="font-sans">Open-source AI/ML utilities</text>
    <text x="20" y="68" fill="#64748B" font-size="10.5" class="font-mono">Full-stack web engineering</text>
  </g>

  <!-- Card 4: Core Philosophy -->
  <g transform="translate(288, 216)">
    <rect x="0" y="0" width="246" height="82" rx="14" fill="url(#innerCardFill)" stroke="url(#innerCardRim)" stroke-width="1.1"/>
    <rect x="0" y="16" width="4.5" height="50" rx="2.2" fill="#F472B6"/>
    <text x="20" y="32" fill="#F8FAFC" font-size="14" font-weight="700" class="font-sans">Core Philosophy</text>
    <text x="20" y="52" fill="#F472B6" font-size="11.5" class="font-sans">Better tomorrow through tech</text>
    <text x="20" y="68" fill="#64748B" font-size="10.5" class="font-mono">while(curiosity) { build(); }</text>
  </g>
</svg>
