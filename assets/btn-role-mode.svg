<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 86" width="265">
  <defs>
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151A" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#0B1926" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0A1324" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="baseRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="waveRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#99F6E4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="35%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#07151A" stop-opacity="0"/>
    </radialGradient>

    <style>
      .font-sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes waveLight {
        0% { stroke-dashoffset: 640; }
        100% { stroke-dashoffset: 0; }
      }
      .floating { animation: floatPill 3.8s ease-in-out infinite; }
      .shimmer {
        stroke-dasharray: 150 490;
        animation: waveLight 4.8s linear infinite;
      }
    </style>
  </defs>

  <g class="floating">
    <rect x="6" y="6" width="268" height="74" rx="26" fill="url(#pillFill)"/>
    <rect x="6" y="6" width="268" height="74" rx="26" fill="url(#topGlow)"/>
    <rect x="6" y="6" width="268" height="74" rx="26" fill="none" stroke="url(#baseRim)" stroke-width="1.3"/>
    <rect x="6" y="6" width="268" height="74" rx="26" fill="none" stroke="url(#waveRim)" stroke-width="2" stroke-linecap="round" class="shimmer"/>

    <circle cx="38" cy="34" r="15" fill="#152832" stroke="#5EEAD4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="38" y="39" fill="#5EEAD4" font-size="14" font-weight="800" text-anchor="middle" class="font-sans">夢</text>

    <text x="64" y="29" fill="#5EEAD4" font-size="10.5" font-weight="800" letter-spacing="1" class="font-sans">BUILDER NODE</text>
    <text x="64" y="45" fill="#F8FAFC" font-size="13.5" font-weight="800" class="font-sans">AI · ML · Full Stack Dev</text>
    <text x="24" y="67" fill="#94A3B8" font-size="10.5" class="font-mono">&gt;_ imagine · build · improve · repeat</text>
  </g>
</svg>
