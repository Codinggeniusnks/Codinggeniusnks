<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%">
  <defs>
    <!-- Cinematic Deep Glass Base -->
    <linearGradient id="cineBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="50%" stop-color="#0B1623"/>
      <stop offset="100%" stop-color="#111328"/>
    </linearGradient>

    <!-- Ambient Top-Left Emerald/Seafoam Spotlight -->
    <radialGradient id="spotMint" cx="22%" cy="8%" r="65%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#14B8A6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Bottom-Right Indigo/Lavender Glow -->
    <radialGradient id="spotViolet" cx="85%" cy="92%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111328" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="rimBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Inner Recessed Card Fill -->
    <linearGradient id="innerCardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061017" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0B1320" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Inner Card Rim Gradient -->
    <linearGradient id="innerCardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.18"/>
    </linearGradient>

    <style>
      .font-sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Rounded Cinematic Glass Frame -->
  <rect x="2" y="2" width="876" height="236" rx="22" fill="url(#cineBase)"/>
  <rect x="2" y="2" width="876" height="236" rx="22" fill="url(#spotMint)"/>
  <rect x="2" y="2" width="876" height="236" rx="22" fill="url(#spotViolet)"/>
  <rect x="2" y="2" width="876" height="236" rx="22" fill="none" stroke="url(#rimBorder)" stroke-width="1.4"/>

  <!-- Section Eyebrow Header -->
  <text x="38" y="46" fill="#5EEAD4" font-size="12" font-weight="800" letter-spacing="3.2" class="font-sans">HIGHLIGHTS &amp; CORE FOCUS</text>
  <text x="695" y="46" fill="#64748B" font-size="11" class="font-mono">SYS // EXECUTIVE_HUD</text>

  <!-- ═══ INNER GLASS CARD 1: AI & MACHINE LEARNING ═══ -->
  <g transform="translate(34, 68)">
    <rect x="0" y="0" width="256" height="136" rx="16" fill="url(#innerCardFill)" stroke="url(#innerCardRim)" stroke-width="1.2"/>
    <!-- Left Vertical Glowing Indicator Pill -->
    <rect x="0" y="28" width="5" height="80" rx="2.5" fill="#5EEAD4"/>
    <text x="26" y="48" fill="#F8FAFC" font-size="19" font-weight="800" class="font-sans">AI &amp; Machine Learning</text>
    <text x="26" y="76" fill="#5EEAD4" font-size="13" font-weight="500" class="font-sans">Current primary focus</text>
    <text x="26" y="106" fill="#94A3B8" font-size="11" class="font-mono">PyTorch · TensorFlow · CV</text>
  </g>

  <!-- ═══ INNER GLASS CARD 2: FULL STACK ENGINEERING ═══ -->
  <g transform="translate(312, 68)">
    <rect x="0" y="0" width="256" height="136" rx="16" fill="url(#innerCardFill)" stroke="url(#innerCardRim)" stroke-width="1.2"/>
    <!-- Left Vertical Glowing Indicator Pill -->
    <rect x="0" y="28" width="5" height="80" rx="2.5" fill="#38BDF8"/>
    <text x="26" y="48" fill="#F8FAFC" font-size="19" font-weight="800" class="font-sans">Full Stack Systems</text>
    <text x="26" y="76" fill="#38BDF8" font-size="13" font-weight="500" class="font-sans">In the active build queue</text>
    <text x="26" y="106" fill="#94A3B8" font-size="11" class="font-mono">React · Next.js · FastAPI</text>
  </g>

  <!-- ═══ INNER GLASS CARD 3: OPEN SOURCE & IMPACT ═══ -->
  <g transform="translate(590, 68)">
    <rect x="0" y="0" width="256" height="136" rx="16" fill="url(#innerCardFill)" stroke="url(#innerCardRim)" stroke-width="1.2"/>
    <!-- Left Vertical Glowing Indicator Pill -->
    <rect x="0" y="28" width="5" height="80" rx="2.5" fill="#818CF8"/>
    <text x="26" y="48" fill="#F8FAFC" font-size="19" font-weight="800" class="font-sans">Open Source &amp; Tech</text>
    <text x="26" y="76" fill="#A78BFA" font-size="13" font-weight="500" class="font-sans">Learn · Build · Improve</text>
    <text x="26" y="106" fill="#94A3B8" font-size="11" class="font-mono">Ideas → Code → Real Impact</text>
  </g>

  <!-- Subtle Corner Signature -->
  <text x="752" y="224" fill="#475569" font-size="11" font-weight="600" class="font-sans">kaisheng.cyber.hud</text>
</svg>
