<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%">
  <defs>
    <!-- Soft Eye-Comfort Dark Slate & Deep Violet Background -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1324"/>
      <stop offset="50%" stop-color="#14182E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Frosted Glass Panel Gradient -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#64D2FF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Soft Specular Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Soft Eye-Comfort Progress Gradients -->
    <linearGradient id="softSkyViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="softVioletRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="softMintSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#64D2FF"/>
    </linearGradient>

    <!-- Soft Ambient Glow Blobs -->
    <radialGradient id="blobSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64D2FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#64D2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobLavender" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <style>
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .font-sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      @keyframes floatSlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      .ambient { animation: floatSlow 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Outer Floating Window Frame -->
  <rect x="2" y="2" width="876" height="326" rx="20" fill="url(#bgGlow)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Subtle Perspective Grid -->
  <g stroke="#CBD5E1" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="60" x2="880" y2="60"/>
    <line x1="0" y1="120" x2="880" y2="120"/>
    <line x1="0" y1="180" x2="880" y2="180"/>
    <line x1="0" y1="240" x2="880" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="330"/>
    <line x1="300" y1="0" x2="300" y2="330"/>
    <line x1="450" y1="0" x2="450" y2="330"/>
    <line x1="600" y1="0" x2="600" y2="330"/>
    <line x1="750" y1="0" x2="750" y2="330"/>
  </g>

  <!-- Soft Ambient Glows -->
  <circle cx="150" cy="120" r="130" fill="url(#blobSky)" class="ambient"/>
  <circle cx="440" cy="220" r="150" fill="url(#blobLavender)" class="ambient"/>
  <circle cx="730" cy="120" r="130" fill="url(#blobRose)" class="ambient"/>

  <!-- macOS / Cyberpunk Glass Window Header Bar -->
  <rect x="16" y="14" width="848" height="34" rx="10" fill="url(#glassSurface)" stroke="url(#glassBorder)" stroke-width="1"/>
  <circle cx="36" cy="31" r="5.5" fill="#F472B6"/>
  <circle cx="54" cy="31" r="5.5" fill="#FBBF24"/>
  <circle cx="72" cy="31" r="5.5" fill="#5EEAD4"/>
  <text x="96" y="35" fill="#E2E8F0" font-size="11.5" font-weight="600" class="font-mono">window://kai-sheng/executive-overview.glass</text>
  <rect x="742" y="21" width="108" height="20" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#5EEAD4" stroke-opacity="0.4"/>
  <text x="754" y="35" fill="#5EEAD4" font-size="10.5" font-weight="600" class="font-mono">● SYS: ONLINE</text>

  <!-- ═══ FLOATING GLASS CARD 1: IDENTITY & CODE PHILOSOPHY ═══ -->
  <g transform="translate(16, 60)">
    <rect x="0" y="0" width="270" height="252" rx="16" fill="url(#glassSurface)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    <line x1="18" y1="1" x2="252" y2="1" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="12" y="12" width="246" height="26" rx="7" fill="#0F172A" fill-opacity="0.55"/>
    <text x="24" y="29" fill="#64D2FF" font-size="11" font-weight="700" class="font-mono">01 // IDENTITY_NODE</text>
    <circle cx="244" cy="25" r="4" fill="#64D2FF"/>

    <text x="20" y="60" fill="#F8FAFC" font-size="16.5" font-weight="700" class="font-sans">Ng Kai Sheng</text>
    <text x="20" y="78" fill="#C4B5FD" font-size="11.5" font-weight="600" class="font-mono">&gt;_ AI • ML • Full Stack Dev</text>

    <rect x="18" y="92" width="112" height="54" rx="10" fill="#0F172A" fill-opacity="0.55" stroke="#64D2FF" stroke-opacity="0.3"/>
    <text x="28" y="111" fill="#94A3B8" font-size="9.5" class="font-mono">PRIMARY FOCUS</text>
    <text x="28" y="132" fill="#64D2FF" font-size="13.5" font-weight="700" class="font-sans">AI &amp; ML</text>

    <rect x="140" y="92" width="112" height="54" rx="10" fill="#0F172A" fill-opacity="0.55" stroke="#F472B6" stroke-opacity="0.3"/>
    <text x="150" y="111" fill="#94A3B8" font-size="9.5" class="font-mono">ARCHITECTURE</text>
    <text x="150" y="132" fill="#F472B6" font-size="13.5" font-weight="700" class="font-sans">Full Stack</text>

    <rect x="18" y="158" width="234" height="78" rx="10" fill="#0B1120" fill-opacity="0.65" stroke="#A78BFA" stroke-opacity="0.35"/>
    <text x="30" y="178" fill="#C4B5FD" font-size="11" class="font-mono">while (curiosity) {</text>
    <text x="44" y="195" fill="#64D2FF" font-size="11" class="font-mono">learn(); build();</text>
    <text x="44" y="212" fill="#F472B6" font-size="11" class="font-mono">improve();</text>
    <text x="30" y="227" fill="#C4B5FD" font-size="11" class="font-mono">}</text>
  </g>

  <!-- ═══ FLOATING GLASS CARD 2: CAPABILITY TELEMETRY ═══ -->
  <g transform="translate(302, 60)">
    <rect x="0" y="0" width="276" height="252" rx="16" fill="url(#glassSurface)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    <line x1="18" y1="1" x2="258" y2="1" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="12" y="12" width="252" height="26" rx="7" fill="#0F172A" fill-opacity="0.55"/>
    <text x="24" y="29" fill="#A78BFA" font-size="11" font-weight="700" class="font-mono">02 // CAPABILITY_METRICS</text>
    <circle cx="250" cy="25" r="4" fill="#A78BFA"/>

    <text x="20" y="60" fill="#E2E8F0" font-size="11.5" font-weight="600" class="font-sans">AI / Machine Learning</text>
    <text x="224" y="60" fill="#64D2FF" font-size="11" font-weight="700" class="font-mono">92%</text>
    <rect x="20" y="68" width="236" height="8" rx="4" fill="#0F172A" fill-opacity="0.8"/>
    <rect x="20" y="68" width="217" height="8" rx="4" fill="url(#softSkyViolet)"/>

    <text x="20" y="100" fill="#E2E8F0" font-size="11.5" font-weight="600" class="font-sans">Full Stack Engineering</text>
    <text x="224" y="100" fill="#A78BFA" font-size="11" font-weight="700" class="font-mono">88%</text>
    <rect x="20" y="108" width="236" height="8" rx="4" fill="#0F172A" fill-opacity="0.8"/>
    <rect x="20" y="108" width="208" height="8" rx="4" fill="url(#softVioletRose)"/>

    <text x="20" y="140" fill="#E2E8F0" font-size="11.5" font-weight="600" class="font-sans">Backend APIs &amp; Data</text>
    <text x="224" y="140" fill="#5EEAD4" font-size="11" font-weight="700" class="font-mono">85%</text>
    <rect x="20" y="148" width="236" height="8" rx="4" fill="#0F172A" fill-opacity="0.8"/>
    <rect x="20" y="148" width="200" height="8" rx="4" fill="url(#softMintSky)"/>

    <text x="20" y="180" fill="#E2E8F0" font-size="11.5" font-weight="600" class="font-sans">Open Source &amp; DevOps</text>
    <text x="224" y="180" fill="#F472B6" font-size="11" font-weight="700" class="font-mono">82%</text>
    <rect x="20" y="188" width="236" height="8" rx="4" fill="#0F172A" fill-opacity="0.8"/>
    <rect x="20" y="188" width="193" height="8" rx="4" fill="url(#softSkyViolet)"/>

    <rect x="20" y="210" width="236" height="26" rx="7" fill="#0F172A" fill-opacity="0.55" stroke="#64D2FF" stroke-opacity="0.25"/>
    <text x="40" y="227" fill="#BAE6FD" font-size="10.5" class="font-mono">✦ IDEAS → CODE → REAL IMPACT</text>
  </g>

  <!-- ═══ FLOATING GLASS CARD 3: NEURAL WORKFLOW PIPELINE ═══ -->
  <g transform="translate(594, 60)">
    <rect x="0" y="0" width="270" height="252" rx="16" fill="url(#glassSurface)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    <line x1="18" y1="1" x2="252" y2="1" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="12" y="12" width="246" height="26" rx="7" fill="#0F172A" fill-opacity="0.55"/>
    <text x="24" y="29" fill="#5EEAD4" font-size="11" font-weight="700" class="font-mono">03 // NEURAL_PIPELINE</text>
    <circle cx="244" cy="25" r="4" fill="#5EEAD4"/>

    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="230" height="39" rx="9" fill="#0F172A" fill-opacity="0.55" stroke="#64D2FF" stroke-opacity="0.35"/>
      <circle cx="22" cy="19.5" r="5.5" fill="#64D2FF"/>
      <text x="38" y="17" fill="#F8FAFC" font-size="11.5" font-weight="700" class="font-sans">01. Research &amp; Ideation</text>
      <text x="38" y="31" fill="#94A3B8" font-size="9.5" class="font-mono">Problem framing • Data exploration</text>
    </g>

    <g transform="translate(20, 98)">
      <rect x="0" y="0" width="230" height="39" rx="9" fill="#0F172A" fill-opacity="0.55" stroke="#A78BFA" stroke-opacity="0.35"/>
      <circle cx="22" cy="19.5" r="5.5" fill="#A78BFA"/>
      <text x="38" y="17" fill="#F8FAFC" font-size="11.5" font-weight="700" class="font-sans">02. Model &amp; System Design</text>
      <text x="38" y="31" fill="#94A3B8" font-size="9.5" class="font-mono">PyTorch / TensorFlow • FastAPI</text>
    </g>

    <g transform="translate(20, 146)">
      <rect x="0" y="0" width="230" height="39" rx="9" fill="#0F172A" fill-opacity="0.55" stroke="#F472B6" stroke-opacity="0.35"/>
      <circle cx="22" cy="19.5" r="5.5" fill="#F472B6"/>
      <text x="38" y="17" fill="#F8FAFC" font-size="11.5" font-weight="700" class="font-sans">03. Full Stack Integration</text>
      <text x="38" y="31" fill="#94A3B8" font-size="9.5" class="font-mono">React • Next.js • TypeScript UI</text>
    </g>

    <g transform="translate(20, 194)">
      <rect x="0" y="0" width="230" height="42" rx="9" fill="#0F172A" fill-opacity="0.55" stroke="#5EEAD4" stroke-opacity="0.35"/>
      <circle cx="22" cy="21" r="5.5" fill="#5EEAD4"/>
      <text x="38" y="17" fill="#F8FAFC" font-size="11.5" font-weight="700" class="font-sans">04. Deploy &amp; Iterate</text>
      <text x="38" y="31" fill="#94A3B8" font-size="9.5" class="font-mono">Docker • CI/CD • Real Impact 夢</text>
    </g>
  </g>
</svg>
