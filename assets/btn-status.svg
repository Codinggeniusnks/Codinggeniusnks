<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" width="205">
  <defs>
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151A" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0D172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0B1324" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="baseRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="waveRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C7D2FE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="35%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07151A" stop-opacity="0"/>
    </radialGradient>

    <style>
      .font-sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes waveLight {
        0% { stroke-dashoffset: 480; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .floating { animation: floatPill 3.5s ease-in-out infinite 0.8s; }
      .shimmer {
        stroke-dasharray: 110 370;
        animation: waveLight 4.6s linear infinite;
      }
      .pulse { animation: pulseDot 2s ease-in-out infinite; }
    </style>
  </defs>

  <g class="floating">
    <rect x="6" y="6" width="198" height="52" rx="26" fill="url(#pillFill)"/>
    <rect x="6" y="6" width="198" height="52" rx="26" fill="url(#topGlow)"/>
    <rect x="6" y="6" width="198" height="52" rx="26" fill="none" stroke="url(#baseRim)" stroke-width="1.3"/>
    <rect x="6" y="6" width="198" height="52" rx="26" fill="none" stroke="url(#waveRim)" stroke-width="2" stroke-linecap="round" class="shimmer"/>

    <circle cx="36" cy="32" r="16" fill="#191D34" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="36" cy="32" r="5.5" fill="#5EEAD4" class="pulse"/>

    <text x="62" y="27" fill="#A78BFA" font-size="10.5" font-weight="800" letter-spacing="0.8" class="font-sans">System Status</text>
    <text x="62" y="44" fill="#F8FAFC" font-size="14" font-weight="800" class="font-sans">Online · Builder</text>
  </g>
</svg>
