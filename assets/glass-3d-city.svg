      @keyframes pulseCity {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .city-glow { animation: pulseCity 4s infinite ease-in-out; }
      .float-pill { animation: floatBadge 3.5s infinite ease-in-out; }
    </style>
