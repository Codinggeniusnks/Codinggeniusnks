<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" width="235">
  <defs>
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151A" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#0A1B26" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#08141E" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="baseRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="waveRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#99F6E4" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="35%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#07151A" stop-opacity="0"/>
    </radialGradient>

    <style>
      .font-sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes waveLight {
        0% { stroke-dashoffset: 540; }
        100% { stroke-dashoffset: 0; }
      }
      .floating { animation: floatPill 3.6s ease-in-out infinite; }
      .shimmer {
        stroke-dasharray: 130 410;
        animation: waveLight 4.2s linear infinite;
      }
    </style>
  </defs>

  <g class="floating">
    <rect x="6" y="6" width="228" height="56" rx="28" fill="url(#pillFill)"/>
    <rect x="6" y="6" width="228" height="56" rx="28" fill="url(#topGlow)"/>
    <rect x="6" y="6" width="228" height="56" rx="28" fill="none" stroke="url(#baseRim)" stroke-width="1.4"/>
    <rect x="6" y="6" width="228" height="56" rx="28" fill="none" stroke="url(#waveRim)" stroke-width="2.2" stroke-linecap="round" class="shimmer"/>

    <!-- Left Circular Badge ("in") -->
    <circle cx="38" cy="34" r="17" fill="#152832" stroke="#5EEAD4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="38" y="39" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle" class="font-sans">in</text>

    <text x="66" y="29" fill="#5EEAD4" font-size="11" font-weight="800" letter-spacing="0.8" class="font-sans">LinkedIn</text>
    <text x="66" y="47" fill="#F8FAFC" font-size="15" font-weight="800" class="font-sans">Ng Kai Sheng</text>
  </g>
</svg>
